<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Masamarsa personal node</title>
  <desc id="description">An original cybernetic interface with signal traces, a scanning reticle, and developer profile data.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07151b"/>
      <stop offset=".58" stop-color="#0a2026"/>
      <stop offset="1" stop-color="#071117"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#a8fff0" stop-opacity=".85"/>
      <stop offset="1" stop-color="#54d9c4" stop-opacity=".24"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#73d9cf" stroke-opacity=".075" stroke-width="1"/>
      <circle cx="0" cy="0" r="1" fill="#80f2df" fill-opacity=".2"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="8" fill="url(#background)"/>
  <rect width="1200" height="360" rx="8" fill="url(#grid)"/>
  <path d="M20 54V20h34M1146 20h34v34M20 306v34h34m1092 0h34v-34" fill="none" stroke="#7cf5df" stroke-opacity=".8" stroke-width="2"/>

  <g fill="#a2c6c1" font-family="monospace" font-size="11" letter-spacing="2">
    <text x="54" y="46">PERSONAL NETWORK / PROFILE INTERFACE</text>
    <text x="1146" y="46" text-anchor="end">NODE 01 · ONLINE</text>
    <text x="54" y="323">IDENTITY RECORD // PUBLIC</text>
    <text x="1146" y="323" text-anchor="end">LAT 35° 40'  N / LONG 139° 42' E</text>
  </g>
  <path d="M54 62H1146" stroke="url(#panel)" stroke-width="1"/>

  <g transform="translate(178 190)" fill="none" stroke="#68e9d5">
    <circle r="91" stroke-opacity=".24"/>
    <circle r="73" stroke-opacity=".52" stroke-dasharray="2 7"/>
    <circle r="51" stroke-opacity=".8"/>
    <circle r="40" stroke="#bafff2" stroke-opacity=".7" stroke-dasharray="32 10 5 10"/>
    <path d="M-112 0H-37M37 0h75M0-112v75M0 37v75" stroke-opacity=".48"/>
    <path d="M-91-55l15 8m-15 47h13m78-88v12m91 31-15 8m15 47h-13m-78 44v-12" stroke-width="2"/>
    <circle r="5" fill="#aaffed" filter="url(#glow)"/>
    <path d="M-35-27L0-46l36 19v42L0 36l-35-21z" stroke-opacity=".36"/>
    <path d="M-24 0h48M0-24v48" stroke-opacity=".5"/>
  </g>

  <g font-family="monospace">
    <text x="330" y="126" fill="#86f3dd" font-size="12" letter-spacing="3">IDENTITY / 001</text>
    <text x="326" y="185" fill="#e1fff8" font-size="48" font-weight="600" letter-spacing="2">MASAMARSA</text>
    <text x="330" y="217" fill="#a7ccc5" font-size="14" letter-spacing="2">WEB APPLICATION DEVELOPER</text>
    <path d="M330 239H698" stroke="#5bd9c7" stroke-opacity=".54"/>
    <text x="330" y="267" fill="#82e9d6" font-size="12" letter-spacing="1">FOCUS</text>
    <text x="391" y="267" fill="#c0d8d3" font-size="12">SYSTEMS PROGRAMMING · SWIFT</text>
  </g>

  <g transform="translate(849 98)" font-family="monospace">
    <path d="M0 0h276v180H0z" fill="#071318" fill-opacity=".52" stroke="#61ddca" stroke-opacity=".38"/>
    <path d="M0 32h276M0 74h276M0 116h276M0 148h276" stroke="#61ddca" stroke-opacity=".16"/>
    <g fill="#a0c4bd" font-size="10" letter-spacing="1.5">
      <text x="16" y="21">SYSTEM READOUT</text>
      <text x="16" y="58">MODE</text>
      <text x="16" y="100">INTEREST</text>
      <text x="16" y="142">STATUS</text>
    </g>
    <g fill="#d4fff5" font-size="11" text-anchor="end">
      <text x="258" y="58">BUILD / LEARN</text>
      <text x="258" y="100">LOW-LEVEL SYSTEMS</text>
      <text x="258" y="142">IN PROGRESS</text>
    </g>
    <circle cx="18" cy="163" r="3" fill="#72f5d9" filter="url(#glow)"/>
    <text x="29" y="167" fill="#86e4d3" font-size="9" letter-spacing="1.3">SIGNAL STABLE</text>
    <text x="258" y="167" fill="#749a94" font-size="9" text-anchor="end">VER. 01.0</text>
  </g>

  <path d="M735 97v180m-7 0h14m-14-180h14" stroke="#75ead8" stroke-opacity=".35"/>
  <path d="M54 292h1092" stroke="#75ead8" stroke-opacity=".2"/>
</svg>
